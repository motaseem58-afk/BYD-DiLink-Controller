name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Force Setup Android Project Structure
      run: |
        # حذف أي ملفات إعدادات قديمة لتجنب التعارض
        rm -f settings.gradle settings.gradle.kts build.gradle build.gradle.kts
        rm -f app/build.gradle app/build.gradle.kts

        # البحث عن مكان AndroidManifest.xml لترتيب ملفات الكود في المسار القياسي
        MANIFEST_PATH=$(find . -name "AndroidManifest.xml" | head -n 1)
        mkdir -p app/src/main

        if [ -n "$MANIFEST_PATH" ]; then
          MANIFEST_DIR=$(dirname "$MANIFEST_PATH")
          if [ "$MANIFEST_DIR" != "./app/src/main" ] && [ "$MANIFEST_DIR" != "app/src/main" ]; then
            mkdir -p /tmp/android_src
            cp -r "$MANIFEST_DIR"/* /tmp/android_src/ || true
            cp -r /tmp/android_src/* app/src/main/ || true
          fi
        fi

        # استخراج اسم الحزمة (Package Name) تلقائياً
        PKG=$(grep -oP 'package="\K[^"]+' app/src/main/AndroidManifest.xml 2>/dev/null || true)
        if [ -z "$PKG" ]; then
          PKG=$(grep -rh -oP '^package \K[a-zA-Z0-9_.]+' app/ 2>/dev/null | head -n 1 || true)
        fi
        if [ -z "$PKG" ]; then
          PKG="com.manasrah.byd.dilinkcontroller"
        fi
        echo "Detected Package Name: $PKG"

        # حل مشكلة الأيقونات المفقودة (ic_launcher & ic_launcher_round) في AndroidManifest.xml
        if [ -f app/src/main/AndroidManifest.xml ]; then
          sed -i 's/@mipmap\/ic_launcher_round/@android:drawable\/sym_def_app_icon/g' app/src/main/AndroidManifest.xml
          sed -i 's/@mipmap\/ic_launcher/@android:drawable\/sym_def_app_icon/g' app/src/main/AndroidManifest.xml
          # إزالة خاصية package القديمة من المانيفست لأن Gradle 8 يعتمد على namespace
          sed -i 's/package="[^"]*"//g' app/src/main/AndroidManifest.xml
        fi

        # 1. إنشاء settings.gradle الرئيسي
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "BYD-DiLink-Controller"
        include ':app'
        EOF

        # 2. إنشاء build.gradle الرئيسي
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF

        # 3. إنشاء gradle.properties
        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        # 4. إنشاء app/build.gradle
        cat << EOF > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace '$PKG'
            compileSdk 34

            defaultConfig {
                applicationId "$PKG"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                debug {
                    minifyEnabled false
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
            lint {
                abortOnError false
                checkReleaseBuilds false
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      run: gradle :app:assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BYD-Controller-APK
        path: app/build/outputs/apk/debug/*.apk
