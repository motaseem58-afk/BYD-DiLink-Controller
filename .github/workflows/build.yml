name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Check project files & Create missing root files
      run: |
        echo "--- Files in root ---"
        ls -la
        echo "--- Files in app/ ---"
        ls -la app/
        
        # إنشاء ملف settings.gradle إذا لم يكن موجوداً
        if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
          cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "BYD-DiLink-Controller"
        include ':app'
        EOF
        fi

        # إنشاء ملف build.gradle الرئيسي إذا لم يكن موجوداً
        if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
          cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.0' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
        }
        EOF
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      run: gradle :app:assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
