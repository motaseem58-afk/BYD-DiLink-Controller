name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Auto-Fix Project Structure & Missing Gradle Files
      run: |
        echo "=== 1. كشف كل الملفات الموجودة في المستودع ==="
        find . -maxdepth 5 -not -path '*/.*'

        # التأكد من مكان ملف AndroidManifest.xml لترتيب المجلدات صح
        MANIFEST_PATH=$(find . -name "AndroidManifest.xml" | head -n 1)
        echo "Found Manifest at: $MANIFEST_PATH"

        # إذا كانت الملفات مرفوعة بدون هيكل قياسي، نرتبها داخل app/src/main
        if [ -n "$MANIFEST_PATH" ] && [ "$MANIFEST_PATH" != "./app/src/main/AndroidManifest.xml" ]; then
          echo "ترتيب مسارات الملفات لتطابق هيكل أندرويد..."
          mkdir -p temp_main
          MANIFEST_DIR=$(dirname "$MANIFEST_PATH")
          cp -r "$MANIFEST_DIR"/* temp_main/ || true
          mkdir -p app/src/main
          cp -r temp_main/* app/src/main/
          rm -rf temp_main
        fi

        # 1. إنشاء ملف settings.gradle الرئيسي
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "BYD-DiLink-Controller"
        include ':app'
        EOF

        # 2. إنشاء ملف build.gradle الرئيسي
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF

        # 3. إنشاء ملف gradle.properties
        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        # 4. إنشاء ملف app/build.gradle بالقوة لضمان تعرف Gradle على مهمة assembleDebug
        if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
          echo "Generating app/build.gradle..."
          mkdir -p app
          
          # استخراج اسم الـ Package تلقائياً من ملفات الكود أو المانيفست
          PKG=$(grep -oP 'package="\K[^"]+' app/src/main/AndroidManifest.xml 2>/dev/null || true)
          if [ -z "$PKG" ]; then
            PKG=$(grep -rh -oP '^package \K[a-zA-Z0-9_.]+' app/ 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$PKG" ]; then
            PKG="com.byd.dilink.controller"
          fi
          echo "Using Package Name: $PKG"

          cat << EOF > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace '$PKG'
            compileSdk 34

            defaultConfig {
                applicationId "$PKG"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                debug {
                    minifyEnabled false
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
            lint {
                abortOnError false
                checkReleaseBuilds false
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        EOF
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      run: gradle :app:assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BYD-Controller-APK
        path: app/build/outputs/apk/debug/*.apk
